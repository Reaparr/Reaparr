version: '1.0'

linter: qodana-cdnet
withinDocker: true
bootstrap: |+
    set -eu
    # The linter container does not inherit the SDK installed on the Actions runner.
    if ! dotnet --version >/dev/null 2>&1; then
        bash -o pipefail -c 'curl -fsSL https://dot.net/v1/dotnet-install.sh | bash -s -- --jsonfile global.json --install-dir /usr/share/dotnet'
    fi
    dotnet restore Reaparr.sln --locked-mode

dotnet:
    solution: Reaparr.sln

profile:
    name: qodana.recommended

exclude:
    -   name: RedundantUsingDirective.Global
    -   name: All
        paths:
            - "**/*.DotSettings"
            - "src/Data/Migrations/*.cs"
            - "**/bin/**"
            - "**/obj/**"
            - "**/*.g.cs"
            - "**/*.g.i.cs"
            - ".editorconfig"
            - "**/.editorconfig"
            - "**/*.globalconfig"
            - "**/*.AssemblyInfo.cs"
            - "**/AssemblyInfo.cs"
            - "**/*.json"
            - "**/node_modules/**"
            - "**/.nuxt/**"
            - "**/.output/**"
            - "**/.nitro/**"
            - "**/dist/**"
            - "**/coverage/**"
            - "**/.cache/**"
            - "**/.eslintcache"
            - "**/cypress/videos/**"
            - "**/cypress/screenshots/**"
            - "**/tsconfig.tsbuildinfo"
            - "**/TestResults/**"
            - "**/test-results/**"
            - "**/.test-artifacts/**"
            - "**/.artifacts/**"
            - "**/.playwright-mcp/**"
            - "**/.idea/**"
            - "**/.vs/**"
            - "**/.agentbridge/**"
            - "**/.agent-work/**"
            - "**/.codex/**"
            - "**/.pi-subagents/**"
            - src/AppHost/ClientApp/src/types/api/generated
    -   name: ArrangeTrailingCommaInMultilineLists
    -   name: SuggestDiscardDeclarationVarStyle
    -   name: XmlHighlighting
    -   name: ExplicitCallerInfoArgument
    -   name: RedundantAnonymousTypePropertyName

fixesStrategy: none
