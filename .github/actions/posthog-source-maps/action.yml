name: 'Upload private PostHog source maps'
description: 'Inject release metadata, upload source maps, and remove maps before packaging the processed assets'
inputs:
    directory:
        description: 'Generated frontend directory, relative to ClientApp'
        required: true
    project-id:
        description: 'PostHog project receiving the private source maps'
        required: true
    api-key:
        description: 'Private personal API key used only by this upload step'
        required: true
    host:
        description: 'Optional direct PostHog management API origin'
        required: false
        default: ''
    ingestion-host:
        description: 'Ingestion origin used to derive the regional management origin when host is unset'
        required: true
    release-version:
        description: 'Exact application informational version that produced these frontend assets'
        required: true
    inject:
        description: 'Inject metadata before upload; false for already-injected build artifacts'
        required: false
        default: 'true'
runs:
    using: 'composite'
    steps:
        -   name: Inject, upload, and remove private source maps
            shell: bash
            working-directory: src/AppHost/ClientApp/
            env:
                POSTHOG_CLI_API_KEY: ${{ inputs.api-key }}
                POSTHOG_CLI_PROJECT_ID: ${{ inputs.project-id }}
                POSTHOG_CLI_HOST: ${{ inputs.host }}
                TELEMETRY_HOST: ${{ inputs.ingestion-host }}
                SOURCE_MAP_DIRECTORY: ${{ inputs.directory }}
                RELEASE_VERSION: ${{ inputs.release-version }}
                INJECT_SOURCE_MAPS: ${{ inputs.inject }}
            run: |
                set -euo pipefail
                if [ -z "$POSTHOG_CLI_HOST" ]; then
                    export POSTHOG_CLI_HOST="${TELEMETRY_HOST/.i.posthog.com/.posthog.com}"
                fi
                test -n "$(find "$SOURCE_MAP_DIRECTORY" -type f -name '*.map' -print -quit)" || { echo "::error::No generated source maps were found"; exit 1; }
                if [ "$INJECT_SOURCE_MAPS" = 'true' ]; then
                    bunx --no-install posthog-cli sourcemap inject --directory "$SOURCE_MAP_DIRECTORY" --release-name reaparr --release-version "$RELEASE_VERSION"
                fi
                bunx --no-install posthog-cli sourcemap upload --directory "$SOURCE_MAP_DIRECTORY" --release-name reaparr --release-version "$RELEASE_VERSION" --delete-after
                test -z "$(find "$SOURCE_MAP_DIRECTORY" -type f -name '*.map' -print -quit)" || { echo "::error::Source maps remain in public assets after upload"; exit 1; }
