name: Desktop Build

# Reusable workflow that builds native installers for Windows, Linux, and macOS via Velopack.
# Can be called with push=true (for releases) or push=false (for testing the build).

on:
    workflow_call:
        inputs:
            version:
                description: 'Release version (e.g. 1.2.3)'
                required: true
                type: string
            informational_version:
                description: 'Informational version (e.g. 1.2.3-dev.1)'
                required: true
                type: string
            telemetry_host:
                description: 'Telemetry HTTPS ingestion origin for release builds'
                required: false
                type: string
                default: ''
            telemetry_project_token:
                description: 'Telemetry public project ingestion token for release builds'
                required: false
                type: string
                default: ''
            posthog_cli_project_id:
                description: 'PostHog project ID for private source-map uploads'
                required: false
                type: string
                default: ''
            posthog_cli_host:
                description: 'Optional direct PostHog management API host'
                required: false
                type: string
                default: ''
            build:
                description: 'Run desktop build and packaging jobs'
                required: false
                type: boolean
                default: true
            upload_artifacts:
                description: 'Upload packaged installers for a later publish phase'
                required: false
                type: boolean
                default: false
            download_previous_release:
                description: 'Download the previous release for delta packaging'
                required: false
                type: boolean
                default: false
            upload_source_maps:
                description: 'Upload private frontend source maps during preparation'
                required: false
                type: boolean
                default: false
            push:
                description: 'Upload installers to the GitHub Release'
                required: false
                type: boolean
                default: false
            publish_release:
                description: 'Publish/finalize the GitHub Release after all desktop assets are uploaded'
                required: false
                type: boolean
                default: false
            velopack_channel:
                description: 'Velopack update channel (dev or stable)'
                required: true
                type: string
        secrets:
            RELEASE_GITHUB_TOKEN:
                required: false
            POSTHOG_CLI_API_KEY:
                required: false

jobs:
    build:
        if: inputs.build
        name: Build desktop installers
        uses: ./.github/workflows/desktop-validate.yml
        permissions:
            contents: read
        with:
            version: ${{ inputs.version }}
            informational_version: ${{ inputs.informational_version }}
            telemetry_host: ${{ inputs.telemetry_host }}
            telemetry_project_token: ${{ inputs.telemetry_project_token }}
            posthog_cli_project_id: ${{ inputs.posthog_cli_project_id }}
            posthog_cli_host: ${{ inputs.posthog_cli_host }}
            upload_artifacts: ${{ inputs.upload_artifacts }}
            download_previous_release: ${{ inputs.download_previous_release }}
            upload_source_maps: ${{ inputs.upload_source_maps }}
            push: ${{ inputs.push }}
            publish_release: ${{ inputs.publish_release }}
            velopack_channel: ${{ inputs.velopack_channel }}
        secrets:
            RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
            POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}

    publish-source-maps:
        name: Publish retained desktop source maps
        if: inputs.push && !inputs.build
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout source code
                uses: actions/checkout@v7
                with:
                    persist-credentials: false
                    ref: ${{ github.sha }}
            -   name: Client App Install
                uses: ./.github/actions/client-app-install/
            -   name: Download retained source maps
                uses: actions/download-artifact@v8
                with:
                    name: frontend-source-maps-desktop
                    path: .tmp/frontend-source-maps-desktop
            -   name: Extract retained source maps
                run: |
                    mkdir -p src/AppHost/ClientApp/.output/public
                    tar -xf .tmp/frontend-source-maps-desktop/frontend-source-maps-desktop.tar -C src/AppHost/ClientApp/.output/public
            -   name: Upload retained source maps
                uses: ./.github/actions/posthog-source-maps/
                with:
                    directory: .output/public
                    project-id: ${{ inputs.posthog_cli_project_id }}
                    api-key: ${{ secrets.POSTHOG_CLI_API_KEY }}
                    host: ${{ inputs.posthog_cli_host }}
                    ingestion-host: ${{ inputs.telemetry_host }}
                    release-version: ${{ inputs.informational_version }}
                    inject: 'false'

    upload-artifacts:
        name: Upload ${{ matrix.rid }} to GitHub Release
        if: ${{ !cancelled() && inputs.push && ((inputs.build && needs.build.result == 'success') || (!inputs.build && needs.publish-source-maps.result == 'success')) }}
        needs: [build, publish-source-maps]
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            max-parallel: 2
            matrix:
                rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64]
        steps:
            -   name: Setup .NET 9 runtime for vpk
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: 9.0.x

            -   name: Install Velopack CLI
                run: dotnet tool install -g vpk --version 1.2.161

            -   name: Download packaged installer artifact
                uses: actions/download-artifact@v8
                with:
                    name: desktop-${{ matrix.rid }}
                    path: Releases/${{ matrix.rid }}

            -   name: Upload installer to GitHub Release
                shell: bash
                env:
                    GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
                    RID: ${{ matrix.rid }}
                    VERSION: ${{ inputs.version }}
                    VELOPACK_CHANNEL: ${{ format('{0}-{1}', matrix.rid, inputs.velopack_channel) }}
                run: |
                    upload_args=(
                        vpk upload github
                        # Bound stalled GitHub asset requests; vpk retries failed uploads.
                        --timeout "30"
                        --repoUrl "https://github.com/$GITHUB_REPOSITORY"
                        --merge
                        --channel "$VELOPACK_CHANNEL"
                        --outputDir "Releases/$RID"
                        --releaseName "Reaparr $VERSION"
                        --tag "v$VERSION"
                        --token "$GITHUB_TOKEN"
                    )
                    "${upload_args[@]}"
    verify-release:
        name: Verify GitHub Release exists
        needs: [ upload-artifacts ]
        if: ${{ !cancelled() && inputs.push && needs.upload-artifacts.result == 'success' }}
        runs-on: ubuntu-latest

        steps:
            -   name: Verify release exists before parallel uploads
                shell: bash
                env:
                    GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
                    RELEASE_TAG: v${{ inputs.version }}
                run: |
                    gh release view "$RELEASE_TAG" \
                        --repo "$GITHUB_REPOSITORY" \
                        --json tagName \
                        --jq '.tagName'


    publish-release:
        name: Publish GitHub Release
        needs: [ verify-release ]
        if: ${{ !cancelled() && inputs.push && inputs.publish_release && needs.verify-release.result == 'success' }}
        runs-on: ubuntu-latest

        steps:
            -   name: Verify all desktop assets uploaded
                shell: bash
                env:
                    GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
                    RELEASE_TAG: v${{ inputs.version }}
                run: |
                    set -euo pipefail

                    asset_names="$(gh release view "$RELEASE_TAG" \
                        --repo "$GITHUB_REPOSITORY" \
                        --json assets \
                        --jq '.assets[].name')"

                    if [[ -z "$asset_names" ]]; then
                        echo "::error::Release $RELEASE_TAG has no uploaded desktop assets." >&2
                        exit 1
                    fi

                    for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
                        if ! grep -F -- "$rid" <<< "$asset_names" >/dev/null; then
                            echo "::error::Release $RELEASE_TAG is missing desktop assets for $rid." >&2
                            exit 1
                        fi
                    done
            -   name: Publish GitHub Release after asset verification
                shell: bash
                env:
                    GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
                    RELEASE_TAG: v${{ inputs.version }}
                run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false