name: Desktop Build

# Reusable workflow that builds native installers for Windows, Linux, and macOS via Velopack.
# Can be called with push=true (for releases) or push=false (for testing the build).

on:
    workflow_call:
        inputs:
            version:
                description: 'Release version (e.g. 1.2.3)'
                required: true
                type: string
            informational_version:
                description: 'Informational version (e.g. 1.2.3-dev.1)'
                required: true
                type: string
            push:
                description: 'Upload installers to the GitHub Release'
                required: false
                type: boolean
                default: false
            publish_release:
                description: 'Publish/finalize the GitHub Release while uploading desktop assets'
                required: false
                type: boolean
                default: false
            velopack_channel:
                description: 'Velopack update channel (dev or stable)'
                required: true
                type: string
        secrets:
            RELEASE_GITHUB_TOKEN:
                required: false

jobs:
    prepare-frontend:
        name: Prepare frontend assets
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout source code
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Client App Install
                uses: ./.github/actions/client-app-install/

            -   name: Generate frontend
                shell: bash
                working-directory: src/AppHost/ClientApp/
                run: bun run generate --fail-on-error

            -   name: Upload generated frontend artifact
                uses: actions/upload-artifact@v7
                with:
                    name: frontend-public
                    path: src/AppHost/ClientApp/.output/public
                    retention-days: 1

    build:
        name: Build ${{ matrix.rid }}
        needs: [ prepare-frontend ]
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   rid: win-x64
                        runner: windows-latest
                    -   rid: win-arm64
                        runner: windows-11-arm
                    -   rid: linux-x64
                        runner: ubuntu-latest
                    -   rid: linux-arm64
                        runner: ubuntu-24.04-arm
                    -   rid: osx-x64
                        runner: macos-15-intel
                    -   rid: osx-arm64
                        runner: macos-15

        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read

        steps:
            -   name: Checkout source code
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Download generated frontend artifact
                uses: actions/download-artifact@v8
                with:
                    name: frontend-public
                    path: .tmp/frontend-public

            -   name: Dotnet Setup (Restore only)
                uses: ./.github/actions/dotnet-setup/
                with:
                    project-path: src/AppHost/AppHost.csproj
                    restore: true
                    build: false
                    # No --locked-mode: the lock file targets the framework-dependent Docker build.
                    # Self-contained desktop builds need RID-specific native packages.
                    locked-mode: false
                    runtime: ${{ matrix.rid }}

            -   name: Setup .NET 9 runtime for vpk
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: 9.0.x

            -   name: Install Velopack CLI
                shell: bash
                run: dotnet tool install -g vpk

            -   name: Derive Velopack channel
                shell: bash
                env:
                    RID: ${{ matrix.rid }}
                    VELOPACK_CHANNEL_INPUT: ${{ inputs.velopack_channel }}
                run: |
                    case "$VELOPACK_CHANNEL_INPUT" in
                        stable|dev)
                            echo "VELOPACK_CHANNEL=$RID-$VELOPACK_CHANNEL_INPUT" >> "$GITHUB_ENV"
                            ;;
                        *)
                            echo "Unsupported Velopack channel: $VELOPACK_CHANNEL_INPUT" >&2
                            exit 1
                            ;;
                    esac

            -   name: Download previous release (for delta packages)
                if: inputs.push
                shell: bash
                run: |
                    mkdir -p Releases
                    vpk download github \
                        --repoUrl https://github.com/${{ github.repository }} \
                        --channel "$VELOPACK_CHANNEL" \
                        --token ${{ secrets.RELEASE_GITHUB_TOKEN }}

            -   name: Package installer via shared CLI
                shell: bash
                env:
                    INFORMATIONAL_VERSION: ${{ inputs.informational_version }}
                    RID: ${{ matrix.rid }}
                    VERSION: ${{ inputs.version }}
                run: |
                    dotnet run --project tools/Build -- desktop ci-package \
                        --rid "$RID" \
                        --version "$VERSION" \
                        --informational-version "$INFORMATIONAL_VERSION" \
                        --channel "$VELOPACK_CHANNEL" \
                        --frontend-public-dir .tmp/frontend-public \
                        --artifact-dir Releases \
                        --preserve-existing-artifacts

            -   name: Upload packed installer artifact
                if: inputs.push
                uses: actions/upload-artifact@v7
                with:
                    name: desktop-${{ matrix.rid }}
                    path: Releases/
                    retention-days: 1

    verify-release:
        name: Verify GitHub Release exists
        needs: [ build ]
        if: inputs.push
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            -   name: Verify release exists before parallel uploads
                shell: bash
                env:
                    GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
                    RELEASE_TAG: v${{ inputs.version }}
                run: |
                    gh release view "$RELEASE_TAG" \
                        --repo "$GITHUB_REPOSITORY" \
                        --json tagName \
                        --jq '.tagName'

    upload-release:
        name: Upload ${{ matrix.rid }} to GitHub Release
        needs: [ build, verify-release ]
        if: inputs.push
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            # Release creation is verified above. Platform channels and asset names are
            # disjoint, so non-publishing uploads can proceed two at a time. Keep
            # publish-release serial because each invocation may finalize the release.
            max-parallel: ${{ inputs.publish_release && 1 || 2 }}
            matrix:
                include:
                    -   rid: win-x64
                    -   rid: win-arm64
                    -   rid: linux-x64
                    -   rid: linux-arm64
                    -   rid: osx-x64
                    -   rid: osx-arm64

        steps:
            -   name: Checkout source code
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Setup .NET 9 runtime for vpk
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: 9.0.x

            -   name: Install Velopack CLI
                run: dotnet tool install -g vpk

            -   name: Derive Velopack channel
                shell: bash
                env:
                    RID: ${{ matrix.rid }}
                    VELOPACK_CHANNEL_INPUT: ${{ inputs.velopack_channel }}
                run: |
                    case "$VELOPACK_CHANNEL_INPUT" in
                        stable|dev)
                            echo "VELOPACK_CHANNEL=$RID-$VELOPACK_CHANNEL_INPUT" >> "$GITHUB_ENV"
                            ;;
                        *)
                            echo "Unsupported Velopack channel: $VELOPACK_CHANNEL_INPUT" >&2
                            exit 1
                            ;;
                    esac

            -   name: Download packed installer
                uses: actions/download-artifact@v8
                with:
                    name: desktop-${{ matrix.rid }}
                    path: Releases/${{ matrix.rid }}

            -   name: Upload installer to GitHub Release
                shell: bash
                env:
                    PUBLISH_RELEASE: ${{ inputs.publish_release }}
                    GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
                    RID: ${{ matrix.rid }}
                    VERSION: ${{ inputs.version }}
                run: |
                    upload_args=(
                        vpk upload github
                        # Bound stalled GitHub asset requests; vpk retries failed uploads.
                        --timeout "30"
                        --repoUrl "https://github.com/$GITHUB_REPOSITORY"
                        --merge
                        --channel "$VELOPACK_CHANNEL"
                        --outputDir "Releases/$RID"
                        --releaseName "Reaparr $VERSION"
                        --tag "v$VERSION"
                        --token "$GITHUB_TOKEN"
                    )
                    if [[ "$PUBLISH_RELEASE" == 'true' ]]; then
                        upload_args+=(--publish)
                    fi
                    "${upload_args[@]}"
