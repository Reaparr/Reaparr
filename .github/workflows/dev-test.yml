name: Execute Tests

on:
    workflow_dispatch:
    pull_request:
        types: [ opened, ready_for_review, reopened, synchronize ]
        paths-ignore:
            - '.ai/**'
            - '.agents/**'
            - '.claude/**'
            - '.cursor/**'
            - '.idea/**'
            - '.junie/**'
            - '.opencode/**'
            - '.skillshare/**'
            - '.slopwatch/**'
            - '.run/**'
            - '.vscode/**'
            - 'README.md'

permissions:
    contents: read

concurrency:
    group: dev-test-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    Pipeline-Deadline:
        name: Pipeline deadline
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        timeout-minutes: 16
        permissions:
            actions: write
        steps:
            -   name: Cancel unfinished tests after 15 minutes
                uses: actions/github-script@v8
                with:
                    script: |
                        const run = { ...context.repo, run_id: context.runId };
                        const { data } = await github.rest.actions.getWorkflowRun(run);
                        const deadline = Date.parse(data.run_started_at) + 15 * 60 * 1000;
                        while (true) {
                            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
                                ...run,
                                attempt_number: Number(process.env.GITHUB_RUN_ATTEMPT),
                                per_page: 100,
                            });
                            const testJobs = jobs.filter(job =>
                                job.name !== 'Pipeline deadline'
                                && job.name !== 'InspectCode'
                                && !job.name.startsWith('Test-Docker-Build / ')
                                && !job.name.startsWith('Test-Desktop-Build / '));
                            if (testJobs.length > 0 && testJobs.every(job => job.status === 'completed')) {
                                core.info('All test/check jobs finished before the deadline; packaging may continue.');
                                return;
                            }
                            const remaining = deadline - Date.now();
                            if (remaining <= 0) {
                                core.warning('Cancelling the workflow: test/check jobs exceeded the 15-minute deadline.');
                                await github.rest.actions.cancelWorkflowRun(run);
                                return;
                            }
                            await new Promise(resolve => setTimeout(resolve, Math.min(15000, remaining)));
                        }

    # Check if PR is in draft
    Check-PR-Status:
        runs-on: ubuntu-latest
        if: github.event.pull_request.draft == false
        steps:
            -   run: echo "PR is not in draft, proceeding with tests"

    InspectCode:
        name: InspectCode
        needs: [ Check-PR-Status, Check-Backend-Changes ]
        if: >-
            !cancelled() &&
            needs.Check-Backend-Changes.result == 'success' &&
            needs.Check-Backend-Changes.outputs.should_run == 'true' &&
            (github.event_name == 'workflow_dispatch' ||
            (needs.Check-PR-Status.result == 'success' && github.event.pull_request.head.repo.full_name == github.repository))
        runs-on: ubuntu-latest
        timeout-minutes: 60
        env:
            DOTNET_CLI_TELEMETRY_OPTOUT: '1'
            MSBuildMaxNodeCount: '1'
            MSBUILDDISABLENODEREUSE: '1'
            DOTNET_CLI_USE_MSBUILD_SERVER: '0'
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Cache InspectCode and MSBuild data
                uses: actions/cache@v6
                with:
                    path: |
                        ~/.local/share/JetBrains
                        ~/.cache/JetBrains
                    key: ${{ runner.os }}-inspectcode-${{ hashFiles('global.json', 'Directory.Build.props', '**/*.csproj', '**/packages.lock.json') }}
                    restore-keys: |
                        ${{ runner.os }}-inspectcode-

            -   name: Restore solution for InspectCode
                uses: ./.github/actions/dotnet-setup/
                with:
                    project-path: Reaparr.sln
                    restore: true
                    build: false

            -   name: Run InspectCode
                uses: JetBrains/ReSharper-InspectCode@v2026.3.0
                with:
                    solution: Reaparr.sln
                    output: inspectcode.sarif
                    format: Sarif
                    sEverity: WARNING
                    jobs: 4
                    no-swea: true
                    build: false
                    upload-sarif: false

            -   name: Require zero warnings and errors
                shell: bash
                run: |
                    jq -e '
                        .runs[0].invocations[0].executionSuccessful == true
                        and ([.runs[].results[]? | select(.level == "warning" or .level == "error")] | length == 0)
                    ' inspectcode.sarif >/dev/null || {
                        echo "InspectCode reported warnings/errors or did not complete successfully." >&2
                        jq -r '.runs[]?.results[]? | select(.level == "warning" or .level == "error") | "\(.level): \(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri // ""):\(.locations[0].physicalLocation.region.startLine // 0): \(.message.text)"' inspectcode.sarif >&2
                        exit 1
                    }

            -   name: Report warning and error counts
                if: always() && hashFiles('inspectcode.sarif') != ''
                shell: bash
                run: |
                    if [[ ! -f inspectcode.sarif ]]; then
                        echo "InspectCode SARIF report was not produced." >&2
                        exit 1
                    fi
                    jq -r '
                        [ .runs[].results[]? | select(.level == "warning") ] as $warnings
                        | [ .runs[].results[]? | select(.level == "error") ] as $errors
                        | "InspectCode totals: \($warnings | length) warnings, \($errors | length) errors"
                    ' inspectcode.sarif

    Actionlint:
        needs: [ Check-PR-Status, Check-Github-Changes ]
        if: needs.Check-Github-Changes.outputs.should_run == 'true' && (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false
            -   name: Run actionlint
                uses: raven-actions/actionlint@v2
                with:
                    fail-on-error: true
                    matcher: true
                    shellcheck: true
                    pyflakes: true

    # Check if .github workflows/actions have changed
    Check-Github-Changes:
        needs: [ Check-PR-Status ]
        if: always() && (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        outputs:
            should_run: ${{ steps.check_changes.outputs.github }}
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false
            -   name: Check if .github has changed
                id: check_changes
                uses: dorny/paths-filter@v4
                with:
                    filters: |
                        github:
                            - '.github/**'

    # Check if front-end has changed
    Check-Frontend-Changes:
        needs: [ Check-PR-Status ]
        if: always() && (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        outputs:
            should_run: ${{ steps.check_changes.outputs.frontend }}
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false
            -   name: Check if front-end has changed
                id: check_changes
                uses: dorny/paths-filter@v4
                with:
                    filters: |
                        frontend:
                            - 'src/AppHost/ClientApp/**'

    # Check if back-end has changed
    Check-Backend-Changes:
        needs: [ Check-PR-Status ]
        if: always() && (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        outputs:
            should_run: ${{ steps.check_changes.outputs.backend }}
            unit_projects: ${{ steps.discover_tests.outputs.unit_projects }}
            integration_projects: ${{ steps.discover_tests.outputs.integration_projects }}
            target_framework: ${{ steps.discover_tests.outputs.target_framework }}
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false
            -   name: Check if back-end has changed
                id: check_changes
                uses: dorny/paths-filter@v4
                with:
                    predicate-quantifier: 'some-with-excludes'
                    filters: |
                        backend:
                            - '{src,tests,tools}/**'
                            - '!src/AppHost/ClientApp/**'
                            - '**/{*.sln,*.slnx,*.csproj,*.props,*.targets,packages.lock.json,global.json,[Nn]u[Gg]et.[Cc]onfig}'
                            - '**/{.editorconfig,*.globalconfig,*.ruleset,*.DotSettings,dotnet-tools.json}'
                            - 'docker/Dockerfile'
                            - '.github/workflows/dev-test.yml'
                            - '.github/actions/dotnet-setup/**'

            -   name: Discover backend test projects
                id: discover_tests
                shell: bash
                run: |
                    set -euo pipefail
                    unit_projects=$(find tests/UnitTests -type f -name '*.csproj' -print | sort | jq -Rsc 'split("\n") | map(select(length > 0) | {project: ., project_name: (split("/")[-1] | sub("\\.csproj$"; ""))})')
                    integration_projects=$(find tests/IntegrationTests -type f -name '*.csproj' -print | sort | jq -Rsc 'split("\n") | map(select(length > 0) | {project: ., project_name: (split("/")[-1] | sub("\\.csproj$"; ""))})')
                    target_framework=$(sed -nE 's|.*<TargetFramework>([^<]+)</TargetFramework>.*|\1|p' Directory.Build.props | sed -n '1p')

                    if [[ "$unit_projects" == '[]' || "$integration_projects" == '[]' || -z "$target_framework" ]]; then
                        echo "Backend test project discovery returned incomplete results" >&2
                        exit 1
                    fi

                    {
                        echo "unit_projects=$unit_projects"
                        echo "integration_projects=$integration_projects"
                        echo "target_framework=$target_framework"
                    } >> "$GITHUB_OUTPUT"

    # Front-End-Type-Check:
    Front-End-Type-Check:
        needs: [ Check-Frontend-Changes, Check-PR-Status ]
        if: needs.Check-Frontend-Changes.outputs.should_run == 'true' && (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false
            -   name: Client App Install
                uses: ./.github/actions/client-app-install/
            -   name: Run Typescript type check
                run: bun run typecheck
                working-directory: src/AppHost/ClientApp/

    # Front-End-Unit-Tests:
    Front-End-Unit-Tests:
        needs: [ Check-Frontend-Changes, Check-PR-Status ]
        if: needs.Check-Frontend-Changes.outputs.should_run == 'true' && (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false
            -   name: Client App Install
                uses: ./.github/actions/client-app-install/
            -   name: Run Vitest tests
                run: bun run unit-test
                working-directory: src/AppHost/ClientApp/
            -   name: Upload test results
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: frontend-test-results
                    path: src/AppHost/ClientApp/test-results
                    retention-days: 7

    Front-End-Eslint-Check:
        needs: [ Check-Frontend-Changes, Check-PR-Status ]
        if: needs.Check-Frontend-Changes.outputs.should_run == 'true' && (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false
            -   name: Client App Install
                uses: ./.github/actions/client-app-install/
            -   name: Run eslint check
                run: bun run lint
                working-directory: src/AppHost/ClientApp/

    Front-End-Integration-Tests:
        needs: [ Check-Frontend-Changes, Check-PR-Status ]
        if: needs.Check-Frontend-Changes.outputs.should_run == 'true' && (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            # Shard locally while Cypress Cloud scheduling is unavailable.
            fail-fast: false
            matrix:
                include:
                    -   containers: 1
                        spec: 'cypress/e2e/pages/+(library|responsive)/**/*.cy.{js,jsx,ts,tsx}'
                    -   containers: 2
                        spec: 'cypress/e2e/pages/+(media-families|authentication|photos)/**/*.cy.{js,jsx,ts,tsx}'
                    -   containers: 3
                        spec: 'cypress/e2e/pages/+(general|dialogs)/**/*.cy.{js,jsx,ts,tsx}'
                    -   containers: 4
                        spec: 'cypress/e2e/pages/!(library|responsive|media-families|authentication|photos|general|dialogs)/**/*.cy.{js,jsx,ts,tsx}'
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false
            -   name: Client App Install
                uses: ./.github/actions/client-app-install/
            -   name: Cache Cypress binary
                uses: actions/cache@v6
                with:
                    path: ~/.cache/Cypress
                    key: ${{ runner.os }}-cypress-${{ hashFiles('**/package.json') }}
                    restore-keys: ${{ runner.os }}-cypress-
            -   name: Setup pinned Chrome
                id: chrome
                uses: browser-actions/setup-chrome@v2
                with:
                    chrome-version: '155.0.8059.39'
            -   name: Run Cypress tests
                uses: cypress-io/github-action@v7.4.4
                with:
                    install: false
                    record: false
                    browser: ${{ steps.chrome.outputs.chrome-path }}
                    start: bun run static-server
                    spec: ${{ matrix.spec }}
                    working-directory: ./src/AppHost/ClientApp/
                    wait-on: 'http://localhost:${{ env.PORT }}'
                env:
                    CYPRESS_NODE_ENV: development
                    PORT: 3035
                    CYPRESS_WEB_PORT: 3035
                    CYPRESS_API_PORT: 3035
                    CYPRESS_RETRIES: 2

    # Back-End Unit Tests
    Back-End-Build:
        needs: [ Check-Backend-Changes, Check-PR-Status ]
        if: needs.Check-Backend-Changes.outputs.should_run == 'true' && (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout Source Code
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Dotnet Setup (Restore only)
                uses: ./.github/actions/dotnet-setup/
                with:
                    project-path: Reaparr.sln
                    restore: true
                    build: false

            -   name: Build Backend Solution
                run: dotnet build Reaparr.sln --no-restore

    Back-End-Unit-Tests:
        needs: [ Check-Backend-Changes, Check-PR-Status ]
        if: needs.Check-Backend-Changes.outputs.should_run == 'true' && (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        name: Back-End-Unit-Tests (${{ matrix.project_name }})
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(needs.Check-Backend-Changes.outputs.unit_projects) }}

        steps:
            -   name: Checkout Source Code
                uses: actions/checkout@v7
                with:
                    persist-credentials: false


            -   name: Dotnet Setup
                uses: ./.github/actions/dotnet-setup/
                with:
                    project-path: ${{ matrix.project }}
                    restore: true
                    build: true

            -   name: Run Unit Tests
                env:
                    TEST_PROJECT: ${{ matrix.project }}
                    TARGET_FRAMEWORK: ${{ needs.Check-Backend-Changes.outputs.target_framework }}
                    TEST_RESULTS_DIRECTORY: TestResults/${{ matrix.project_name }}
                    TUNIT_GITHUB_REPORTER_STYLE: collapsible
                run: |
                    project_directory=${TEST_PROJECT%/*}
                    assembly_name=$(sed -nE 's|.*<AssemblyName>([^<]+)</AssemblyName>.*|\1|p' "$TEST_PROJECT" | sed -n '1p')
                    assembly_name=${assembly_name:-${TEST_PROJECT##*/}}
                    assembly_name=${assembly_name%.csproj}
                    test_executable="$project_directory/bin/Debug/$TARGET_FRAMEWORK/$assembly_name"

                    "$test_executable" \
                        --output Normal \
                        --results-directory "$TEST_RESULTS_DIRECTORY" \
                        --report-trx \
                        --report-trx-filename test_results.trx \
                        --coverage \
                        --coverage-output-format cobertura \
                        --coverage-output "$TEST_RESULTS_DIRECTORY/coverage.cobertura.xml"
            -   name: Upload Test Outputs
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: backend-test-output-${{ matrix.project_name }}
                    path: TestResults/${{ matrix.project_name }}
                    retention-days: 7

    # Back-End Integration Tests
    Back-End-Integration-Tests:
        needs: [ Check-Backend-Changes, Check-PR-Status ]
        if: needs.Check-Backend-Changes.outputs.should_run == 'true' && (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        name: Back-End-Integration-Tests (${{ matrix.project_name }})
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(needs.Check-Backend-Changes.outputs.integration_projects) }}

        steps:
            -   name: Checkout Source Code
                uses: actions/checkout@v7
                with:
                    persist-credentials: false


            -   name: Dotnet Setup
                uses: ./.github/actions/dotnet-setup/
                with:
                    project-path: ${{ matrix.project }}
                    restore: true
                    build: true

            -   name: Run Integration Tests
                env:
                    TEST_PROJECT: ${{ matrix.project }}
                    TARGET_FRAMEWORK: ${{ needs.Check-Backend-Changes.outputs.target_framework }}
                    TEST_RESULTS_DIRECTORY: TestResults/${{ matrix.project_name }}
                    TUNIT_GITHUB_REPORTER_STYLE: collapsible
                run: |
                    project_directory=${TEST_PROJECT%/*}
                    assembly_name=$(sed -nE 's|.*<AssemblyName>([^<]+)</AssemblyName>.*|\1|p' "$TEST_PROJECT" | sed -n '1p')
                    assembly_name=${assembly_name:-${TEST_PROJECT##*/}}
                    assembly_name=${assembly_name%.csproj}
                    test_executable="$project_directory/bin/Debug/$TARGET_FRAMEWORK/$assembly_name"

                    "$test_executable" \
                        --output Normal \
                        --results-directory "$TEST_RESULTS_DIRECTORY" \
                        --report-trx \
                        --report-trx-filename test_results.trx \
                        --coverage \
                        --coverage-output-format cobertura \
                        --coverage-output "$TEST_RESULTS_DIRECTORY/coverage.cobertura.xml"

            -   name: Upload Integration Test Outputs
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: backend-test-output-${{ matrix.project_name }}
                    path: TestResults/${{ matrix.project_name }}
                    retention-days: 7

    # Code Coverage Report
    Code-Coverage-Report:
        needs: [ Back-End-Unit-Tests, Back-End-Integration-Tests, Check-PR-Status ]
        if: always() && (needs.Back-End-Unit-Tests.result != 'skipped' || needs.Back-End-Integration-Tests.result != 'skipped') && (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        steps:
            -   name: Download Coverage Reports
                uses: actions/download-artifact@v8
                with:
                    pattern: backend-test-output-*
                    path: coverage-reports

            -   name: Generate Code Coverage Report
                uses: danielpalme/ReportGenerator-GitHub-Action@v5
                with:
                    reports: 'coverage-reports/**/coverage.cobertura.xml'
                    targetdir: 'coveragereport'
                    reporttypes: 'HtmlInline;Cobertura;Badges'

            -   name: Upload Coverage Report
                uses: actions/upload-artifact@v7
                with:
                    name: code-coverage-report
                    path: coveragereport
                    retention-days: 7

    # Ensure Docker images can be built without errors (both amd64 and arm64)
    Test-Docker-Build:
        needs: [ Check-Frontend-Changes, Check-Backend-Changes, Back-End-Build, Back-End-Unit-Tests, Back-End-Integration-Tests, Front-End-Type-Check, Front-End-Unit-Tests, Front-End-Eslint-Check, Front-End-Integration-Tests, Actionlint, Check-PR-Status ]
        if: |
            always() &&
            (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch') &&
            !contains(needs.*.result, 'failure') &&
            !contains(needs.*.result, 'cancelled')
        uses: ./.github/workflows/docker-validate.yml
        with:
            push: false
            version: 9.9.9
            informational_version: 9.9.9-dev

    # Ensure desktop installers can be built without errors (Windows/Linux/macOS)
    Test-Desktop-Build:
        needs: [ Check-Frontend-Changes, Check-Backend-Changes, Back-End-Build, Back-End-Unit-Tests, Back-End-Integration-Tests, Front-End-Type-Check, Front-End-Unit-Tests, Front-End-Eslint-Check, Front-End-Integration-Tests, Actionlint, Check-PR-Status ]
        if: |
            always() &&
            (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch') &&
            !contains(needs.*.result, 'failure') &&
            !contains(needs.*.result, 'cancelled')
        uses: ./.github/workflows/desktop-validate.yml
        with:
            push: false
            version: 9.9.9
            informational_version: 9.9.9-dev
            velopack_channel: dev
