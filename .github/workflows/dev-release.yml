name: Create Reaparr Dev Release

on:
    workflow_dispatch:
    push:
        branches:
            - dev
        paths-ignore:
            - '.idea/**'
            - '.run/**'
            - '.vscode/**'
            - 'release.config.mjs'
            - 'README.md'

concurrency:
    group: dev-release
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    # Semantic Release for Dev Prereleases
    semantic-release:
        name: Semantic Release (DEV Release)
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
            pull-requests: write
        steps:
            -   name: Checkout source code
                uses: actions/checkout@v7
                with:
                    token: ${{ secrets.GH_TOKEN }}
                    fetch-depth: 0
                    ref: dev

            -   name: Client App Install
                uses: ./.github/actions/client-app-install/

            -   name: Run Semantic Release (DEV Release)
                id: semantic-release
                run: bun src/AppHost/ClientApp/node_modules/semantic-release/bin/semantic-release.js --debug
                env:
                    # STABLE_RELEASE not set = appends -dev.N suffix to computed version
                    GH_TOKEN: ${{ secrets.GH_TOKEN }}
                    GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME }}
                    GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL }}
                    GIT_COMMITTER_NAME: ${{ vars.GIT_COMMITTER_NAME }}
                    GIT_COMMITTER_EMAIL: ${{ vars.GIT_COMMITTER_EMAIL }}

            -   name: Log Release Info
                run: |
                    echo "::notice::Release published: ${{ steps.semantic-release.outputs.new-release-published }}"
                    echo "::notice::Version: ${{ steps.semantic-release.outputs.new-release-version }}"
        outputs:
            new-release-published: ${{ steps.semantic-release.outputs.new-release-published }}
            new-release-version: ${{ steps.semantic-release.outputs.new-release-version }}
            new-release-notes: ${{ steps.semantic-release.outputs.new-release-notes }}

    # Build and publish desktop apps for all platforms
    build-desktop:
        name: Build Desktop Apps (DEV)
        needs: [ semantic-release ]
        if: needs.semantic-release.outputs.new-release-published == 'true'
        permissions:
            contents: write
        uses: ./.github/workflows/desktop-build.yml
        secrets:
            RELEASE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
            push: true
            publish_release: true
            version: ${{ needs.semantic-release.outputs.new-release-version }}
            informational_version: ${{ needs.semantic-release.outputs.new-release-version }}
            telemetry_host: ${{ vars.TELEMETRY_HOST }}
            telemetry_project_token: ${{ vars.TELEMETRY_PROJECT_TOKEN }}
            velopack_channel: dev

    # Build and publish multi-arch Docker images
    build-and-publish:
        name: Build and Publish Docker Images
        needs: [ semantic-release ]
        if: needs.semantic-release.outputs.new-release-published == 'true'
        uses: ./.github/workflows/docker-build-multiarch.yml
        secrets:
            DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
            DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        with:
            push: true
            version: ${{ needs.semantic-release.outputs.new-release-version }}
            informational_version: ${{ needs.semantic-release.outputs.new-release-version }}
            telemetry_host: ${{ vars.TELEMETRY_HOST }}
            telemetry_project_token: ${{ vars.TELEMETRY_PROJECT_TOKEN }}
            tags: "dev"

    # Notifications (depends on build-and-publish and build-desktop)
    notify-discord:
        name: Notify Discord
        needs: [ semantic-release, build-and-publish, build-desktop ]
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout source code
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Notify Discord of Dev Release
                uses: ./.github/actions/discord-dev-release-notification/
                with:
                    webhook: ${{ secrets.DISCORD_RELEASES_CHANNEL_WEBHOOK }}
                    version: ${{ needs.semantic-release.outputs.new-release-version }}
                    is-dev: true
                    changelog-url: 'https://github.com/Reaparr/Reaparr/releases/tag/v${{ needs.semantic-release.outputs.new-release-version }}'

            -   name: Post Changelog to Discord
                uses: ./.github/actions/discord-changelog-notification/
                with:
                    webhook: ${{ secrets.DISCORD_CHANGELOG_CHANNEL_WEBHOOK }}
                    version: ${{ needs.semantic-release.outputs.new-release-version }}
                    changelog: ${{ needs.semantic-release.outputs.new-release-notes }}
                    is-dev: true
