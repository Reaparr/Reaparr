name: Create Reaparr Dev Release

on:
    workflow_dispatch:

concurrency:
    group: dev-release
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    # Fail before planning if source-map publishing credentials are unavailable.
    validate-source-map-publishing:
        name: Validate source-map publishing credentials
        if: github.ref == 'refs/heads/dev'
        uses: ./.github/workflows/validate-source-map-publishing.yml
        with:
            posthog_cli_project_id: ${{ vars.POSTHOG_CLI_PROJECT_ID }}
        secrets:
            POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}

    # Dry-run semantic-release calculates the version and notes without mutating the repository.
    release-plan:
        name: Plan Semantic Release (DEV)
        needs: [ validate-source-map-publishing ]
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            -   name: Checkout source code
                uses: actions/checkout@v7
                with:
                    persist-credentials: false
                    fetch-depth: 0
                    ref: ${{ github.sha }}

            -   name: Set release branch to dispatched commit
                env:
                    SOURCE_SHA: ${{ github.sha }}
                run: git checkout -B dev "$SOURCE_SHA"

            -   name: Client App Install
                uses: ./.github/actions/client-app-install/

            -   name: Plan Semantic Release (DEV)
                id: semantic-release-plan
                run: bun src/AppHost/ClientApp/node_modules/semantic-release/bin/semantic-release.js --dry-run --debug
                env:
                    # STABLE_RELEASE not set = appends -dev.N suffix to computed version
                    GH_TOKEN: ${{ secrets.GH_TOKEN }}
                    GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME }}
                    GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL }}
                    GIT_COMMITTER_NAME: ${{ vars.GIT_COMMITTER_NAME }}
                    GIT_COMMITTER_EMAIL: ${{ vars.GIT_COMMITTER_EMAIL }}

            -   name: Log Release Plan
                run: |
                    echo "::notice::Release planned: ${{ steps.semantic-release-plan.outputs.new-release-published }}"
                    echo "::notice::Version: ${{ steps.semantic-release-plan.outputs.new-release-version }}"
        outputs:
            new-release-published: ${{ steps.semantic-release-plan.outputs.new-release-published }}
            new-release-version: ${{ steps.semantic-release-plan.outputs.new-release-version }}
            new-release-notes: ${{ steps.semantic-release-plan.outputs.new-release-notes }}

    # Build both product families without creating releases or pushing images.
    validate-desktop:
        name: Validate Desktop Build (DEV)
        needs: [ release-plan ]
        if: needs.release-plan.outputs.new-release-published == 'true'
        permissions:
            contents: read
        uses: ./.github/workflows/desktop-build.yml
        secrets:
            RELEASE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
        with:
            build: true
            upload_artifacts: true
            download_previous_release: true
            upload_source_maps: false
            push: false
            publish_release: false
            version: ${{ needs.release-plan.outputs.new-release-version }}
            informational_version: ${{ needs.release-plan.outputs.new-release-version }}
            telemetry_host: ${{ vars.TELEMETRY_HOST }}
            telemetry_project_token: ${{ vars.TELEMETRY_PROJECT_TOKEN }}
            posthog_cli_project_id: ${{ vars.POSTHOG_CLI_PROJECT_ID }}
            posthog_cli_host: ${{ vars.POSTHOG_CLI_HOST }}
            velopack_channel: dev

    validate-docker:
        name: Validate Docker Build (DEV)
        needs: [ release-plan ]
        if: needs.release-plan.outputs.new-release-published == 'true'
        permissions:
            contents: read
        uses: ./.github/workflows/docker-build-multiarch.yml
        secrets:
            DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
            DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
            POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
        with:
            build: true
            export_images: true
            push: false
            version: ${{ needs.release-plan.outputs.new-release-version }}
            informational_version: ${{ needs.release-plan.outputs.new-release-version }}
            telemetry_host: ${{ vars.TELEMETRY_HOST }}
            telemetry_project_token: ${{ vars.TELEMETRY_PROJECT_TOKEN }}
            posthog_cli_project_id: ${{ vars.POSTHOG_CLI_PROJECT_ID }}
            posthog_cli_host: ${{ vars.POSTHOG_CLI_HOST }}
            tags: "dev"

    # This is the release point of no return: commit, tag, and draft release creation happen only after both builds pass.
    finalize-release:
        name: Finalize Semantic Release (DEV)
        needs: [ release-plan, validate-desktop, validate-docker ]
        if: needs.release-plan.outputs.new-release-published == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            -   name: Checkout source code
                uses: actions/checkout@v7
                with:
                    persist-credentials: false
                    fetch-depth: 0
                    ref: ${{ github.sha }}

            -   name: Require the built commit still heads dev
                env:
                    SOURCE_SHA: ${{ github.sha }}
                run: |
                    remote_sha="$(git ls-remote origin refs/heads/dev | cut -f1)"
                    if [ "$remote_sha" != "$SOURCE_SHA" ]; then
                        echo '::error::dev moved while artifacts were building. Trigger a new release for the new commit.'
                        exit 1
                    fi
                    git checkout -B dev "$SOURCE_SHA"

            -   name: Client App Install
                uses: ./.github/actions/client-app-install/

            -   name: Recheck planned version before release mutations
                id: recheck
                run: bun src/AppHost/ClientApp/node_modules/semantic-release/bin/semantic-release.js --dry-run
                env:
                    GH_TOKEN: ${{ secrets.GH_TOKEN }}

            -   name: Require the version used by the built artifacts
                env:
                    EXPECTED_VERSION: ${{ needs.release-plan.outputs.new-release-version }}
                    ACTUAL_VERSION: ${{ steps.recheck.outputs.new-release-version }}
                run: test "$ACTUAL_VERSION" = "$EXPECTED_VERSION"

            -   name: Finalize Semantic Release (DEV)
                run: |
                    remote_sha="$(git ls-remote origin refs/heads/dev | cut -f1)"
                    if [ "$remote_sha" != "$SOURCE_SHA" ]; then
                        echo '::error::dev moved before release finalization. Trigger a new release.'
                        exit 1
                    fi
                    bun src/AppHost/ClientApp/node_modules/semantic-release/bin/semantic-release.js --debug
                env:
                    # STABLE_RELEASE not set = appends -dev.N suffix to computed version
                    GH_TOKEN: ${{ secrets.GH_TOKEN }}
                    SOURCE_SHA: ${{ github.sha }}
                    GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME }}
                    GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL }}
                    GIT_COMMITTER_NAME: ${{ vars.GIT_COMMITTER_NAME }}
                    GIT_COMMITTER_EMAIL: ${{ vars.GIT_COMMITTER_EMAIL }}

    # Publish the stored build artifacts only after the release commit, tag, and draft exist.
    publish-desktop:
        name: Publish Desktop Apps (DEV)
        needs: [ release-plan, finalize-release ]
        if: needs.release-plan.outputs.new-release-published == 'true'
        permissions:
            contents: write
        uses: ./.github/workflows/desktop-build.yml
        secrets:
            RELEASE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
        with:
            build: false
            upload_artifacts: true
            download_previous_release: false
            upload_source_maps: false
            push: true
            publish_release: true
            version: ${{ needs.release-plan.outputs.new-release-version }}
            informational_version: ${{ needs.release-plan.outputs.new-release-version }}
            telemetry_host: ${{ vars.TELEMETRY_HOST }}
            telemetry_project_token: ${{ vars.TELEMETRY_PROJECT_TOKEN }}
            posthog_cli_project_id: ${{ vars.POSTHOG_CLI_PROJECT_ID }}
            posthog_cli_host: ${{ vars.POSTHOG_CLI_HOST }}
            velopack_channel: dev

    publish-docker:
        name: Publish Docker Images (DEV)
        needs: [ release-plan, finalize-release ]
        if: needs.release-plan.outputs.new-release-published == 'true'
        permissions:
            contents: read
        uses: ./.github/workflows/docker-build-multiarch.yml
        secrets:
            DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
            DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
            POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
        with:
            build: false
            export_images: false
            push: true
            version: ${{ needs.release-plan.outputs.new-release-version }}
            informational_version: ${{ needs.release-plan.outputs.new-release-version }}
            telemetry_host: ${{ vars.TELEMETRY_HOST }}
            telemetry_project_token: ${{ vars.TELEMETRY_PROJECT_TOKEN }}
            posthog_cli_project_id: ${{ vars.POSTHOG_CLI_PROJECT_ID }}
            posthog_cli_host: ${{ vars.POSTHOG_CLI_HOST }}
            tags: "dev"

    notify-discord:
        name: Notify Discord
        needs: [ release-plan, finalize-release, publish-docker, publish-desktop ]
        if: needs.release-plan.outputs.new-release-published == 'true'
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout source code
                uses: actions/checkout@v7
                with:
                    persist-credentials: false
                    ref: ${{ github.sha }}

            -   name: Notify Discord of Dev Release
                uses: ./.github/actions/discord-dev-release-notification/
                with:
                    webhook: ${{ secrets.DISCORD_RELEASES_CHANNEL_WEBHOOK }}
                    version: ${{ needs.release-plan.outputs.new-release-version }}
                    is-dev: true
                    changelog-url: 'https://github.com/Reaparr/Reaparr/releases/tag/v${{ needs.release-plan.outputs.new-release-version }}'

            -   name: Post Changelog to Discord
                uses: ./.github/actions/discord-changelog-notification/
                with:
                    webhook: ${{ secrets.DISCORD_CHANGELOG_CHANNEL_WEBHOOK }}
                    version: ${{ needs.release-plan.outputs.new-release-version }}
                    changelog: ${{ needs.release-plan.outputs.new-release-notes }}
                    is-dev: true
