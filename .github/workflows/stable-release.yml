name: Create Reaparr Stable Release
on:
    workflow_dispatch:

concurrency:
    group: stable-release
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    semantic-release:
        # Only allow stable releases from the dev branch
        if: github.ref_name == 'dev'
        name: Semantic Release (Stable)
        runs-on: ubuntu-latest
        permissions:
            contents: write # to be able to publish a GitHub release
            issues: write # to be able to comment on released issues
            pull-requests: write # to be able to comment on released pull requests
        steps:
            -   name: Checkout source code
                uses: actions/checkout@v7
                with:
                    token: ${{ secrets.GH_TOKEN }}
                    fetch-depth: 0
                    ref: dev

            # This is required to be able to run semantic-release plugins
            -   name: Client App Install
                uses: ./.github/actions/client-app-install/

            -   name: GitHub Release (Stable)
                id: get-next-version
                run: bun src/AppHost/ClientApp/node_modules/semantic-release/bin/semantic-release.js
                env:
                    STABLE_RELEASE: 'true'
                    GH_TOKEN: ${{ secrets.GH_TOKEN }}
                    GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME }}
                    GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL }}
                    GIT_COMMITTER_NAME: ${{ vars.GIT_COMMITTER_NAME }}
                    GIT_COMMITTER_EMAIL: ${{ vars.GIT_COMMITTER_EMAIL }}

            -   name: Log Release Info
                run: |
                    echo "::notice::Release published: ${{ steps.get-next-version.outputs.new-release-published }}"
                    echo "::notice::Version: ${{ steps.get-next-version.outputs.new-release-version }}"

            -   name: Guard - Fail if no release due
                if: steps.get-next-version.outputs.new-release-published != 'true'
                run: |
                    echo "::error::No release was published. Either no commits since last tag or commits don't trigger a release."
                    echo "::error::Check that commits follow conventional commit format (feat:, fix:, etc.)"
                    exit 1
        outputs:
            new-release-published: ${{ steps.get-next-version.outputs.new-release-published }}
            new-release-version: ${{ steps.get-next-version.outputs.new-release-version }}
            new-release-notes: ${{ steps.get-next-version.outputs.new-release-notes }}
    
    # Build and publish desktop apps for all platforms
    build-desktop:
        name: Build Desktop Apps
        needs: [ semantic-release ]
        if: needs.semantic-release.outputs.new-release-published == 'true'
        permissions:
            contents: write
        uses: ./.github/workflows/desktop-build.yml
        secrets:
            RELEASE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
            push: true
            publish_release: true
            version: ${{ needs.semantic-release.outputs.new-release-version }}
            informational_version: ${{ needs.semantic-release.outputs.new-release-version }}
            telemetry_host: ${{ vars.TELEMETRY_HOST }}
            telemetry_project_token: ${{ vars.TELEMETRY_PROJECT_TOKEN }}
            velopack_channel: stable

    # Build and publish multi-arch Docker images
    build-and-publish:
        name: Build and Publish Docker Images
        if: needs.semantic-release.outputs.new-release-published == 'true'
        needs: [ semantic-release ]
        uses: ./.github/workflows/docker-build-multiarch.yml
        secrets:
            DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
            DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        with:
            push: true
            version: ${{ needs.semantic-release.outputs.new-release-version }}
            informational_version: ${{ needs.semantic-release.outputs.new-release-version }}
            telemetry_host: ${{ vars.TELEMETRY_HOST }}
            telemetry_project_token: ${{ vars.TELEMETRY_PROJECT_TOKEN }}
            tags: "latest"

    # Notifications (depends on build-and-publish and build-desktop)
    notify-discord:
        name: Notify Discord
        needs: [ semantic-release, build-and-publish, build-desktop ]
        if: needs.semantic-release.outputs.new-release-published == 'true'
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout source code
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Notify Discord of Stable Release
                uses: ./.github/actions/discord-dev-release-notification/
                with:
                    webhook: ${{ secrets.DISCORD_RELEASES_CHANNEL_WEBHOOK }}
                    version: ${{ needs.semantic-release.outputs.new-release-version }}
                    is-dev: false
                    changelog-url: "https://github.com/Reaparr/Reaparr/releases/tag/v${{ needs.semantic-release.outputs.new-release-version }}"

            -   name: Post Changelog to Discord
                uses: ./.github/actions/discord-changelog-notification/
                with:
                    webhook: ${{ secrets.DISCORD_CHANGELOG_CHANNEL_WEBHOOK }}
                    version: ${{ needs.semantic-release.outputs.new-release-version }}
                    changelog: ${{ needs.semantic-release.outputs.new-release-notes }}
                    is-dev: false
